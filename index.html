<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Footprints" />
    <!-- アイコンの名前には版数（-v4）を付けている。
         同じ名前のまま絵だけ差し替えても、端末とGitHubに残った古い画像が
         出続けてアイコンが変わらない。描き替えたら必ず版数を上げること -->
    <link rel="manifest" href="./manifest-v4.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v4.png" />
    <link rel="icon" type="image/png" href="./icon-192-v4.png" />
    <title>Footprints</title>
    <style>
      .boot { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
              color: #404040; padding: 40px 24px; max-width: 480px; margin: 0 auto; line-height: 1.8; }
      .boot-t { color: #a3a3a3; font-size: 14px; text-align: center; }
      /* くわしい案内は少し待ってから出す。ふつうに読み込めたときは目に触れない */
      .boot-late { opacity: 0; animation: bootlate 0s 2.5s forwards; }
      @keyframes bootlate { to { opacity: 1; } }
      .boot-h { font-size: 17px; font-weight: 700; color: #134E4A; margin-bottom: 4px; }
      .boot ol { padding-left: 1.2em; }
      .boot li { margin-bottom: 10px; }
      .boot code { background: #f5f5f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <!-- プログラムが読み込めなかったときの案内。
         正しく動いていれば、Reactがこの中身を丸ごと置き換えるので目に触れない。
         真っ白な画面だと原因が分からないため、この保険を入れてある -->
    <div id="root">
      <div class="boot">
        <p class="boot-t">読み込んでいます…</p>
        <div class="boot-late">
          <p class="boot-h">プログラムを読み込めませんでした</p>
          <p>GitHubで公開している場合は、次の2つをご確認ください。</p>
          <ol>
            <li>リポジトリに <code>.github/workflows/deploy.yml</code> があるか<br>
              （隠しフォルダのため、アップロードの際に抜け落ちることがあります）</li>
            <li>Settings → Pages の Source が <b>GitHub Actions</b> になっているか<br>
              （Deploy from a branch だと、組み立て前のファイルがそのまま配られ、この画面になります）</li>
          </ol>
          <p>Actionsタブで最新の実行が緑色になっているかも合わせてご確認ください。</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
